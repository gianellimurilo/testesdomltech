<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bora Lá</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a ficha do lugar é o centro do produto. Lista e mapa ilustrado de Ribeirão Preto lado a lado,
   selos de confiança em cada recurso, azul como cor de ação e verde-azulado como cor da marca. */
:root{
  --bg:#F4F8FA;--surface:#FFFFFF;--surface-2:#EBF2F6;--fg:#0D2230;--muted:#47606F;--line:#D5E1E8;
  --brand:#0B5BD3;--on-brand:#FFFFFF;--brand-soft:#E2EDFC;--teal:#0A8473;--teal-soft:#DAF2ED;
  --good:#156F45;--good-soft:#DCF2E5;--warn:#7D5200;--warn-soft:#FBEBC8;--bad:#A8321A;--bad-soft:#FBE3DC;
  --na:#51626D;--na-soft:#E6ECF0;--on-status:#FFFFFF;--focus:#0B5BD3;
  --m-land:#E8F0EE;--m-water:#BFDCF3;--m-park:#C6E5CE;--m-road:#FFFFFF;--m-edge:#D3DEDA;--m-label:#4F6A66;
  --shadow:0 1px 2px rgba(13,34,48,.06),0 10px 28px rgba(13,34,48,.08);
  --font-display:'Inter','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09151D;--surface:#0F1F2A;--surface-2:#152A37;--fg:#E6F0F5;--muted:#9BB1BE;--line:#233B4A;
    --brand:#7DB0FF;--on-brand:#06162E;--brand-soft:#12294B;--teal:#3FCDB4;--teal-soft:#0E3A36;
    --good:#52D493;--good-soft:#0F3524;--warn:#F2BC4E;--warn-soft:#3B2D0B;--bad:#FF8F75;--bad-soft:#42211A;
    --na:#9BB1BE;--na-soft:#1A2D39;--on-status:#07150D;--focus:#9CC3FF;
    --m-land:#10222B;--m-water:#123D5C;--m-park:#15412F;--m-road:#1C3441;--m-edge:#264553;--m-label:#8AA7A2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09151D;--surface:#0F1F2A;--surface-2:#152A37;--fg:#E6F0F5;--muted:#9BB1BE;--line:#233B4A;
  --brand:#7DB0FF;--on-brand:#06162E;--brand-soft:#12294B;--teal:#3FCDB4;--teal-soft:#0E3A36;
  --good:#52D493;--good-soft:#0F3524;--warn:#F2BC4E;--warn-soft:#3B2D0B;--bad:#FF8F75;--bad-soft:#42211A;
  --na:#9BB1BE;--na-soft:#1A2D39;--on-status:#07150D;--focus:#9CC3FF;
  --m-land:#10222B;--m-water:#123D5C;--m-park:#15412F;--m-road:#1C3441;--m-edge:#264553;--m-label:#8AA7A2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding-inline:16px;padding-block:0 24px;background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(2rem,4.6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,2.8vw,2.1rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin-inline:auto}
.wrap.wide{max-width:1560px}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;padding:10px 16px;border-radius:10px;background:var(--brand);color:var(--on-brand);border:0;font-weight:700}
.skip:focus{left:16px}

/* banner de dados demonstrativos */
.demo-banner{margin-inline:-16px;padding:8px 16px;background:var(--brand-soft);font-size:.875rem;display:flex;gap:8px;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap}
.demo-banner strong{font-weight:700}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:-16px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1560px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 8px 4px 0;font-family:var(--font-display);font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.brand svg{display:block}
.nav{display:flex;gap:2px;margin-left:12px}
.nav-btn{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:12px;border:0;background:none;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.spacer{flex:1}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;line-height:1.2;text-align:center;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:6px 12px;font-size:.9rem}
.btn.big{min-height:54px;padding:12px 28px;font-size:1.05rem;letter-spacing:.04em}
.link{background:none;border:0;padding:0;font-weight:700;color:inherit;text-align:left;text-decoration:none}
.link:hover{text-decoration:underline}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.chip.sm{min-height:36px;padding:4px 12px;font-size:.9rem}

/* selos */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.82rem;font-weight:700;line-height:1.3}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.na{background:var(--na-soft);color:var(--na)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:8px;font-size:.75rem;font-weight:700;background:rgba(6,20,30,.72);color:#fff;letter-spacing:.02em}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--muted);max-width:60ch}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:40px 24px}
.hero-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero h1 em{font-style:normal;color:var(--brand)}
.search{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:14px;min-width:0}
.field:focus-within{background:var(--brand-soft)}
.field label{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input{border:0;background:transparent;outline:0;font-size:1.05rem;min-width:0;width:100%;padding:2px 0}
.field input::placeholder{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sample{padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.sample h2{font-size:1.25rem}
.sample-prefs{display:flex;flex-wrap:wrap;gap:6px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);border:0;text-align:left;width:100%}
.srow:hover{outline:2px solid var(--brand)}
.srow b{display:block;font-family:var(--font-display)}
.srow small{color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-block:24px;counter-reset:f}
.flow li{position:relative;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:600;counter-increment:f;display:flex;flex-direction:column;gap:8px}
.flow li::before{content:counter(f);font-family:var(--font-display);font-weight:800;color:var(--teal);font-size:1.4rem}
.section{padding-block:32px;display:flex;flex-direction:column;gap:20px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:stretch}
.vs .card{padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.vs .old{background:var(--surface-2);border-style:dashed}
.vs .old q{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--muted)}
.mini-list{display:flex;flex-direction:column;gap:10px}
.mini-list li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.cta{margin-block:32px;padding:clamp(24px,4vw,48px);border-radius:28px;background:var(--brand);color:var(--on-brand);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.cta h2{max-width:20ch}
.cta p{max-width:46ch;opacity:.92}
.cta .btn{background:var(--on-brand);color:var(--brand);border-color:var(--on-brand)}

/* explorar */
.ex-head{display:flex;flex-direction:column;gap:12px;padding-block:20px 12px}
.ex-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.ex-bar .field{background:var(--surface);border:1.5px solid var(--line);flex:1 1 260px}
.ex-bar select{border:0;background:transparent;font-size:1rem;padding:2px 0;outline:0;width:100%}
.ex-grid{display:grid;grid-template-columns:268px minmax(360px,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);max-height:calc(100vh - 90px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.filters fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.filters legend{font-family:var(--font-display);font-weight:700;padding:0;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 6px;border-radius:10px;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin:0}
.f-close,.f-open{display:none}
.list{display:flex;flex-direction:column;gap:16px;min-width:0}
.count{font-weight:700}
.mapcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);height:min(calc(100vh - 92px),860px);min-height:460px}
.map{position:relative;height:100%;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--m-land)}
.map.full{height:min(72vh,720px);min-height:420px}
.map svg.base{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.map svg.base:active{cursor:grabbing}
.m-land{fill:var(--m-land)}
.m-water{stroke:var(--m-water);fill:none}
.m-park{fill:var(--m-park)}
.m-grid line{stroke:var(--m-road);stroke-width:5;opacity:.75}
.m-art path,.m-art ellipse{stroke:var(--m-road);stroke-width:12;fill:none;stroke-linecap:round}
.m-edge path,.m-edge ellipse{stroke:var(--m-edge);stroke-width:15;fill:none;stroke-linecap:round}
.m-lbl{fill:var(--m-label);font:700 17px var(--font-body);letter-spacing:.14em;text-transform:uppercase}
.m-lbl.s{font-size:13px;letter-spacing:.06em;text-transform:none}
.mk{cursor:pointer}
.mk .shape{stroke:var(--surface);stroke-width:3}
.mk.good .shape{fill:var(--good)}
.mk.part .shape{fill:var(--warn)}
.mk.low .shape{fill:var(--bad)}
.mk .glyph{fill:none;stroke:var(--on-status);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk .rf{fill:none;stroke:var(--focus);stroke-width:4;opacity:0}
.mk:focus{outline:none}
.mk:focus-visible .rf,.mk.sel .rf,.mk.hl .rf{opacity:1}
.map-ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.map-ctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:1.3rem;line-height:1;display:grid;place-items:center}
.legend{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:.8rem;font-weight:600}
.legend li{display:flex;align-items:center;gap:8px}
.map-note{position:absolute;right:12px;bottom:10px;font-size:.75rem;background:var(--surface);padding:2px 8px;border-radius:8px;color:var(--muted);border:1px solid var(--line)}
.popup{position:absolute;left:12px;bottom:40px;width:min(380px,calc(100% - 24px));padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.popup .p-top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.popup h3{font-size:1.05rem}

/* ficha do lugar na lista */
.est{overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.est:hover,.est.sel{box-shadow:var(--shadow);border-color:var(--brand)}
.media{position:relative;height:132px;background:var(--surface-2)}
.media .photo{display:block;width:100%;height:100%}
.media .tag{position:absolute;left:10px;top:10px}
.fav{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);color:var(--fg)}
.fav[aria-pressed="true"]{color:var(--bad)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.est .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.topline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:.875rem;color:var(--muted);font-weight:600}
.topline span{display:inline-flex;align-items:center;gap:6px}
.est h3 a,.est h3 button{font-size:1.25rem}
.compat{display:flex;align-items:center;gap:12px}
.compat b{font-family:var(--font-display);font-size:1.15rem;display:block;line-height:1.2}
.compat small{color:var(--muted);font-size:.875rem}
.ring text{fill:var(--fg);font:800 15px var(--font-display);text-anchor:middle;dominant-baseline:central}
.ring .trk{stroke:var(--surface-2);fill:none}
.ring .bar{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .bar.good{stroke:var(--good)}.ring .bar.warn{stroke:var(--warn)}.ring .bar.bad{stroke:var(--bad)}
.scores{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;font-size:.92rem}
.scores dt{display:flex;align-items:center;gap:6px;font-weight:600}
.scores dd{margin:0}
.stars{display:inline-flex;align-items:center;gap:1px;color:var(--warn)}
.stars svg{fill:none}
.stars svg.on{fill:currentColor}
.stars .num{margin-left:6px;font-weight:700;color:var(--fg);font-size:.9rem}
.feats{display:flex;flex-wrap:wrap;gap:6px}
.feat{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.82rem;font-weight:600}
.feat.y{background:var(--good-soft);color:var(--good)}
.feat.n{background:var(--na-soft);color:var(--na)}
.feat.n .t{text-decoration:line-through}
.feat.u{background:var(--na-soft);color:var(--na)}
.foot-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;font-size:.9rem;color:var(--muted);font-weight:600}
.empty{padding:32px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* página do lugar */
.back{margin-block:16px 8px}
.d-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:stretch}
.d-main{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.d-main .media{height:200px}
.d-info{padding:20px;display:flex;flex-direction:column;gap:12px}
.d-info h1{font-size:clamp(1.8rem,3.4vw,2.8rem)}
.d-actions{display:flex;flex-wrap:wrap;gap:8px}
.d-side{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.d-side .compat b{font-size:1.4rem}
.plist{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.plist li{display:flex;align-items:center;gap:8px}
.ok{color:var(--good)}.bad-c{color:var(--bad)}.warn-c{color:var(--warn)}.na-c{color:var(--na)}
.vsx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.vsx .card{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.vsx li{display:flex;align-items:flex-start;gap:8px}
.last{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);margin-top:8px}
.grp{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.grp>h2{font-size:1.4rem;display:flex;align-items:center;gap:10px}
.frows{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:8px 16px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.frow.flash{animation:flash 2.4s ease-out 1}
@keyframes flash{from{background:var(--brand-soft);border-color:var(--brand)}to{background:var(--surface)}}
.frow .nm{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.frow .lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.frow .cell{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.92rem}
.frow .cell span.v{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ev{margin:0;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.ev svg,.ev img{display:block;width:100%;height:110px;object-fit:cover}
.ev figcaption{padding:8px 12px;display:flex;flex-direction:column;font-size:.85rem}
.ev figcaption strong{font-size:.95rem}
.ev figcaption span{color:var(--muted)}
.rv{padding:16px;display:flex;flex-direction:column;gap:8px}
.rv-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.rv-top{display:flex;gap:6px;flex-wrap:wrap}
.rv img{max-width:240px;border-radius:12px}
.rvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

/* diálogos */

function chartSVG(){
 var v=[412,478,540,611,688,764,850,938,1034,1128,1214,1284],W=640,H=270,l=52,r=28,t=24,b=36,max=1500;
 var x=function(i){return l+(W-l-r)*i/(v.length-1)},y=function(n){return t+(H-t-b)*(1-n/max)};
 var pts=v.map(function(n,i){return x(i).toFixed(1)+' '+y(n).toFixed(1)});
 var ticks=[0,500,1000,1500];
 var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de linha: avaliações acumuladas em 12 semanas, de 412 na primeira semana a 1.284 na última.">';
 ticks.forEach(function(n){s+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y(n)+'" y2="'+y(n)+'"/><text x="'+(l-8)+'" y="'+(y(n)+4)+'" text-anchor="end">'+br(n)+'</text>'});
 s+='<path class="area" d="M'+x(0)+' '+y(0)+' L'+pts.join(' L')+' L'+x(v.length-1)+' '+y(0)+'z"/><path class="ln" d="M'+pts.join(' L')+'"/>';
 v.forEach(function(n,i){s+='<text x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle">S'+(i+1)+'</text>'});
 var lx=x(v.length-1),ly=y(v[v.length-1]);
 s+='<circle class="dot" cx="'+lx+'" cy="'+ly+'" r="6"/><text class="end" x="'+lx+'" y="'+(ly-14)+'" text-anchor="end">'+br(v[v.length-1])+'</text></svg>';
 return s;
}

 '<div><label class="lb" for="r-text">Conte como foi sua experiência</label><textarea id="r-text" placeholder="Ex.: A entrada possui uma rampa, mas ela é um pouco inclinada."></textarea></div>'+
 '<div class="thumb"><label class="btn filebtn">'+ico('camera',18)+'Adicionar foto<input class="sr" type="file" id="r-photo" accept="image/*"></label><span id="r-prev"></span></div>'+

 var e=byId(S.biz);

function readPhoto(file,cb){
 var fr=new FileReader();
 fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=function(){cb(null)};im.src=fr.result};
 fr.onerror=function(){cb(null)};fr.readAsDataURL(file);
}

/* ---------- ações ---------- */
function toggleFav(id){
 var i=S.favs.indexOf(id),on=i<0;
 if(on)S.favs.push(id);else S.favs.splice(i,1);
 persist();
 toast(on?'Salvo nos favoritos':'Removido dos favoritos');
 if(S.route==='place'||S.route==='favs'||S.route==='profile')render(false);
 else $$('.fav[data-id="'+id+'"]').forEach(function(b){b.setAttribute('aria-pressed',on)});
}
function setFilterKeys(keys,on){keys.forEach(function(k){var i=S.filters.indexOf(k);if(on&&i<0)S.filters.push(k);if(!on&&i>=0)S.filters.splice(i,1)})}
var ACT={
 skip:function(){$('#app').focus()},
 prefs:function(){openDlg(prefsDlg())},
 'prefs-clear':function(){$$('#prefs-form input').forEach(function(i){i.checked=false})},
 close:function(){closeDlg()},
 open:function(t){closeDlg();openEst(t.getAttribute('data-id'))},
 back:function(){goTo(S.prev&&S.prev!=='place'?S.prev:'explore')},
 fav:function(t){toggleFav(t.getAttribute('data-id'))},
 visit:function(t){var id=t.getAttribute('data-id'),i=S.visited.indexOf(id);if(i<0){S.visited.push(id);toast('Marcado como visitado')}else{S.visited.splice(i,1);toast('Removido dos visitados')}persist();render(false)},
 review:function(t){openDlg(reviewDlg(t.getAttribute('data-id')||(S.route==='place'?S.param:'pinguim')))},
 marker:function(t){openPopup(t.getAttribute('data-id'))},
 'popup-close':function(){closePopup()},
 'zoom-in':function(){if(M.map)M.map.zoomIn()},
 'zoom-out':function(){if(M.map)M.map.zoomOut()},
 'zoom-reset':function(){fitMap()},
 'filters-open':function(){var f=$('#filters');f.classList.add('open');f.setAttribute('role','dialog');f.setAttribute('aria-modal','true');var b=$('.f-close',f);if(b)b.focus()},
 'filters-close':function(){var f=$('#filters');f.classList.remove('open');f.removeAttribute('role');f.removeAttribute('aria-modal')},
 'filters-clear':function(){S.types=[];S.filters=[];S.prefs=[];S.q='';var q=$('#q');if(q)q.value='';syncChecks();updateResults()},
 'rm-chip':function(t){var k=t.getAttribute('data-k'),a=t.getAttribute('data-kind')==='type'?S.types:S.filters,i=a.indexOf(k);if(i>=0)a.splice(i,1);syncChecks();updateResults()},
 view:function(t){S.view=t.getAttribute('data-v');var g=$('#ex-grid');if(g)g.setAttribute('data-view',S.view);$$('.view-tabs .chip').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-v')===S.view)});setTimeout(fitMap,60)},
 shortcut:function(t){var s=SHORTCUTS.filter(function(x){return x.id===t.getAttribute('data-id')})[0],on=s.keys.every(function(k){return S.filters.indexOf(k)>=0});setFilterKeys(s.keys,!on);S.prefs=S.filters.slice();persist();t.setAttribute('aria-pressed',!on)},
 'chip-search':function(t){var q=$('#hq');q.value=t.getAttribute('data-q');$('#home-form').requestSubmit?$('#home-form').requestSubmit():doHomeSearch()},
 demo:function(){S.prefs=['stepfree','wc','vegan'];S.filters=S.prefs.slice();S.types=['restaurante'];S.filters=[];S.q='';S.sort='compat';persist();goTo('explore');toast('Preferências de exemplo: entrada sem escadas, banheiro acessível e vegano')},
 tab:function(t){S.tab=t.getAttribute('data-t');render(false)},
 'biz-update':function(){openDlg(infoDlg())},
 'clear-rate':function(t){var fs=t.closest('.rate');$$('input',fs).forEach(function(i){i.checked=false});$$('.sbtn',fs).forEach(function(l){l.classList.remove('on')})},
 'photo-clear':function(){PHOTO=null;$('#r-prev').innerHTML='';$('#r-photo').value=''},
 'see-changes':function(t){closeDlg();S.dirty=false;S.flash=RMAP.map(function(m){return m[1]});openEst(t.getAttribute('data-id'))}
};
function doHomeSearch(){
 var v=$('#hq').value.trim(),t=typeFromQuery(v);
 S.types=t?[t]:[];S.q=t?'':v;
 goTo('explore');
}
document.addEventListener('click',function(ev){
 var tg=ev.target;
 if(tg.id==='dlg'){closeDlg();return}
 var g=tg.closest('[data-go]');
 if(g){var d=$('#dlg');if(d.open)d.close();goTo(g.getAttribute('data-go'));return}
 var t=tg.closest('[data-act]');
 if(!t){var c=tg.closest('.est');if(c&&!tg.closest('a,button,input,select,label,textarea'))openEst(c.getAttribute('data-id'));return}
 var f=ACT[t.getAttribute('data-act')];if(f)f(t,ev);
});
document.addEventListener('keydown',function(ev){
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('mk')){ev.preventDefault();openPopup(ev.target.getAttribute('data-id'))}
 if(ev.key==='Escape'){var f=$('#filters');if(f&&f.classList.contains('open')){ACT['filters-close']()}}
});
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.matches&&t.matches('input[data-type]')){var k=t.getAttribute('data-type'),i=S.types.indexOf(k);if(t.checked&&i<0)S.types.push(k);if(!t.checked&&i>=0)S.types.splice(i,1);updateResults()}
 else if(t.matches&&t.matches('input[data-filter]')){var k2=t.getAttribute('data-filter'),j=S.filters.indexOf(k2);if(t.checked&&j<0)S.filters.push(k2);if(!t.checked&&j>=0)S.filters.splice(j,1);updateResults()}
 else if(t.id==='sort'){S.sort=t.value;updateResults()}
 else if(t.id==='biz-sel'){S.biz=t.value;render(false)}
 else if(t.matches&&t.matches('.rate input[type=radio]')){var fs=t.closest('.rate'),v=+t.value;$$('.sbtn',fs).forEach(function(l,idx){l.classList.toggle('on',idx<v)})}
 else if(t.id==='r-photo'){
  var file=t.files&&t.files[0];if(!file)return;
  readPhoto(file,function(u){PHOTO=u;$('#r-prev').innerHTML=u?'<img src="'+u+'" alt="Pré-visualização da foto escolhida" style="width:72px;height:72px;object-fit:cover;border-radius:12px"> <button type="button" class="btn ghost small" data-act="photo-clear">Remover foto</button>':'<span class="err">Não foi possível ler essa imagem.</span>'});
 }
});
document.addEventListener('input',function(ev){if(ev.target.id==='q'){S.q=ev.target.value;updateResults()}});
document.addEventListener('submit',function(ev){
 var f=ev.target;ev.preventDefault();
 if(f.id==='home-form'){doHomeSearch();return}
 if(f.id==='ex-form'){return}
 if(f.id==='prefs-form'){
  S.prefs=$$('input[data-pref]',f).filter(function(i){return i.checked}).map(function(i){return i.getAttribute('data-pref')});
  S.filters=S.prefs.slice();persist();closeDlg();toast(S.prefs.length?'Necessidades salvas. A compatibilidade foi atualizada.':'Preferências removidas');render(false);return;
 }
 if(f.id==='info-form'){
  var id=S.biz;S.ov[id]=S.ov[id]||{};
  $$('select[data-k]',f).forEach(function(s){var k=s.getAttribute('data-k'),base=(byId(id).f[k]||UN)[0];if(s.value===base)delete S.ov[id][k];else S.ov[id][k]=s.value});
  persist();closeDlg();toast('Informações atualizadas');render(false);return;
 }
 if(f.id==='review-form'){
  var est=byId($('#r-est').value),ratings={},any=false;
  RMAP.forEach(function(m){var c=$('input[name="r-'+m[0]+'"]:checked',f);if(c){ratings[m[0]]=+c.value;any=true}});
  if(!any){$('#r-err').textContent='Escolha pelo menos uma nota para enviar a avaliação.';return}
  var before=snap(est);
  S.reviews.push({id:Date.now(),est:est.id,ratings:ratings,text:$('#r-text').value.trim(),photo:PHOTO,ts:Date.now()});
  if(S.visited.indexOf(est.id)<0)S.visited.push(est.id);
  persist();
  var after=snap(est),keys=RMAP.filter(function(m){return ratings[m[0]]!=null});
  S.dirty=true;
  $('#dlg').innerHTML=thanksDlg(est,before,after,keys);
  var h=$('#dlg-t');if(h){h.setAttribute('tabindex','-1');h.focus()}
 }
});
$('#dlg').addEventListener('close',function(){
 if(S.dirty){S.dirty=false;render(false)}
 if(lastFocus&&document.contains(lastFocus)&&lastFocus.focus)lastFocus.focus();
});

render(false);
})();
